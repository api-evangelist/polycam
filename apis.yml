aid: polycam
name: Polycam
description: >-
  Polycam is a cross-platform 3D scanning and capture company building
  consumer and professional tools for turning the physical world into
  high-fidelity 3D content. Its iOS, Android, and web apps support
  LiDAR-based space capture, photogrammetry, photosphere capture,
  AI-generated 3D models, and Gaussian Splat reconstructions, with export
  formats including glTF/GLB, OBJ, FBX, DAE, STL, USDZ, point clouds, and
  CAD-friendly files. Polycam serves freelancers, AEC and real-estate
  teams, VFX and game studios, e-commerce sellers, and enterprise
  operators with 2D/3D floor plans, measurement tools, shared team
  libraries, virtual walkthroughs, AI reports, custom branding, SSO, and
  TransformEngine for custom 3D file creation. Revenue is subscription
  based across Free, Basic ($30/mo or $150/yr), Business ($400/yr per
  user), and Enterprise tiers, with sales-led pricing for organizations
  at scale. Polycam exposes a developer mode in the iOS app that unlocks
  a raw-data export bundle (raw.glb mesh, keyframes, images, cameras,
  depth maps, confidence data, mesh_info.json) used by partners such as
  Vuforia, Immersal, and Unity/Unreal workflows, and ships an open-source
  Python toolkit (polyform) for converting raw captures to NeRF and other
  research formats. As of this profile there is no public REST API,
  OpenAPI specification, or developer portal — integrations happen
  through raw exports, partner pipelines, and the Polycam app surface
  itself.
